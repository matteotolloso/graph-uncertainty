# Detached dual head + interval-consistency penalty (not in the paper).
#
# defaults: used by `cgnn run` (and as the base config of every sweep run).
# sweep:    W&B sweep definition; dataset metadata (in/out_channels, batch_size, num_neighbors) is merged in by `cgnn sweep`.
defaults:
  gnn_type: GCN
  hidden_channels: 64
  num_layers: 2
  lr: 0.001
  delta: 0.75
  lambda_cls: 1.0
  lambda_cons: 0.1
  patience: 20
  monitor: val_auroc_EU
  mode: max
sweep:
  method: bayes
  metric:
    name: val_auroc_EU
    goal: maximize
  parameters:
    lr:
      distribution: uniform
      min: 1.0e-05
      max: 0.01
    hidden_channels:
      values: [64]
    num_layers:
      values: [2]
    delta:
      distribution: uniform
      min: 0.5
      max: 1.0
    lambda_cls:
      distribution: uniform
      min: 0.1
      max: 2.0
    lambda_cons:
      values: [0.01, 0.05, 0.1, 0.25]
    gnn_type:
      values: [GCN, SAGE]
    patience:
      values: [20]
    monitor:
      values: [val_auroc_EU]
    mode:
      values: [max]
    num_sanity_val_steps:
      values: [0]
