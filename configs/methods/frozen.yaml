# Paper: CGNN post train (credal head trained on the joint latent of a frozen vanilla backbone).
#
# defaults: used by `cgnn run` (and as the base config of every sweep run).
# sweep:    W&B sweep definition; dataset metadata (in/out_channels, batch_size, num_neighbors) is merged in by `cgnn sweep`.
defaults:
  lr: 0.001
  weight_decay: 0.0
  delta: 0.75
  backbone_rank: 0
  patience: 10
  monitor: val_auroc_EU
  mode: max
sweep:
  method: bayes
  metric:
    name: val_auroc_EU
    goal: maximize
  parameters:
    lr:
      distribution: uniform
      min: 1.0e-05
      max: 0.1
    weight_decay:
      distribution: uniform
      min: 1.0e-07
      max: 0.1
    backbone_rank:
      values: [0, 1, 2, 3, 4]
    delta:
      distribution: uniform
      min: 0.5
      max: 1.0
    patience:
      values: [10]
    monitor:
      values: [val_auroc_EU]
    mode:
      values: [max]
    num_sanity_val_steps:
      values: [0]
