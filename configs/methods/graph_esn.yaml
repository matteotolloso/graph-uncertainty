# Graph Echo State Network ensemble (exploratory, not in the paper). Requires `graphesn`.
#
# defaults: used by `cgnn run` (and as the base config of every sweep run).
# sweep:    W&B sweep definition; dataset metadata (in/out_channels, batch_size, num_neighbors) is merged in by `cgnn sweep`.
defaults:
  hidden_channels: 128
  num_layers: 1
  spectral_radius: 0.9
  input_scaling: 0.1
  leakage: 0.9
  num_reservoirs: 10
  readout_regularization: 0.01
  bias: false
  pooling: none
  fully: false
  max_iterations: 100
  epsilon: 1.0e-06
  max_epochs: 1
  early_stopping: false
  monitor: val_auroc_TU_credal
  mode: max
sweep:
  method: bayes
  metric:
    name: val_auroc_TU_credal
    goal: maximize
  parameters:
    hidden_channels:
      distribution: int_uniform
      min: 64
      max: 256
    num_layers:
      distribution: int_uniform
      min: 1
      max: 3
    spectral_radius:
      distribution: uniform
      min: 0.5
      max: 0.9
    input_scaling:
      distribution: log_uniform_values
      min: 0.001
      max: 1.0
    leakage:
      distribution: uniform
      min: 0.3
      max: 1.0
    num_reservoirs:
      distribution: int_uniform
      min: 10
      max: 100
    readout_regularization:
      distribution: log_uniform_values
      min: 1.0e-05
      max: 100.0
    bias:
      values: [false, true]
    pooling:
      values: [none]
    fully:
      values: [false, true]
    max_iterations:
      distribution: int_uniform
      min: 50
      max: 150
    epsilon:
      distribution: log_uniform_values
      min: 1.0e-07
      max: 0.0001
