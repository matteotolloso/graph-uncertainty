# Paper: GEBM (post-hoc, requires the graph-ebm submodule / graph_uq). Runs on CPU.
#
# defaults: used by `cgnn run` (and as the base config of every sweep run).
# sweep:    W&B sweep definition; dataset metadata (in/out_channels, batch_size, num_neighbors) is merged in by `cgnn sweep`.
defaults:
  deterministic: false
  backbone_rank: 0
  accelerator: cpu
sweep:
  method: grid
  metric:
    name: val_auroc
    goal: maximize
  parameters:
    backbone_rank:
      values: [0, 1, 2, 3, 4]
